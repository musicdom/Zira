<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORBITA — Каталог MAX</title>
    <style>
        :root {
            --bg: #F5FAFF;
            --bg-secondary: #E5F3FF;
            --bg-card: #FFFFFF;
            --purple: #4DA3F5;
            --purple-light: #318BEA;
            --pink: #4DA3F5;
            --pink-light: #E5F3FF;
            --text: #172536;
            --text-secondary: #718398;
            --text-muted: #A0B8CC;
            --border: #DCEAF6;
            --glow-purple: rgba(77, 163, 245, 0.08);
            --glow-pink: rgba(77, 163, 245, 0.08);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --nav-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --safe-top: env(safe-area-inset-top, 0px);
            --max-width: 1200px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            line-height: 1.4;
            letter-spacing: -0.01em;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === SPLASH SCREEN === */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #F5FAFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        #splash-screen.splash-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-content {
            text-align: center;
        }
        .splash-rocket-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
        }
        .splash-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border: 2px dashed #DCEAF6;
            border-radius: 50%;
            animation: splash-orbit-spin 10s linear infinite;
        }
        .splash-orbit::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #4DA3F5;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(77, 163, 245, 0.5);
        }
        .splash-rocket {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            transform-origin: -62px 0; /* вращение вокруг центра контейнера (100px,100px) */
            animation: splash-rocket-orbit 6s linear infinite;
        }
        .splash-rocket svg {
            width: 100%;
            height: 100%;
            transform: rotate(45deg); /* повернуть ракету по направлению движения */
        }
        @keyframes splash-rocket-orbit {
            from { transform: rotate(0deg) translateX(80px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
        }
        @keyframes splash-orbit-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .splash-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .splash-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .splash-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4DA3F5;
            animation: splash-blink 1.5s infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: 0.2s; }
        .splash-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes splash-blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* === ОСНОВНОЙ ИНТЕРФЕЙС (скрыт под сплэшем) === */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(77, 163, 245, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(77, 163, 245, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(200, 230, 255, 0.3) 0%, transparent 70%);
        }
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--max-width);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + var(--safe-top)) 18px 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text);
            cursor: pointer;
        }
        .header-logo svg { width: 32px; height: 32px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            position: relative;
        }
        .icon-btn:hover, .icon-btn:active { background: var(--bg-secondary); color: var(--purple-light); }
        .icon-btn .badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--purple);
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
        }
        .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .page { flex: 1; padding: 10px 16px 0; animation: pageIn 0.2s ease-out; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .hero { text-align: center; padding: 10px 0 14px; }
        .hero h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text); margin-bottom: 2px; }
        .hero .subtitle { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.01em; }
        .hero .tags-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .hero .tag-pill {
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--bg-secondary);
            color: var(--purple-light);
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        .search-wrap { position: relative; margin: 6px 0 14px; }
        .search-input {
            width: 100%;
            padding: 13px 18px 13px 44px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.01em;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(77,163,245,0.1); }
        .search-icon-svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .cat-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-wrap: nowrap;
        }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }
        .cat-chip.active {
            background: var(--purple);
            border-color: var(--purple);
            color: #fff;
            box-shadow: 0 2px 8px rgba(77,163,245,0.2);
        }
        .big-cats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .big-cat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 18px 14px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(40,100,150,0.06);
        }
        .big-cat-card:hover, .big-cat-card:active {
            border-color: var(--purple);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(40,100,150,0.1);
        }
        .folder-stack { position: relative; width: 70px; height: 70px; margin-bottom: 12px; }
        .folder {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--bg-secondary);
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: var(--transition);
        }
        .folder.back1 { transform: rotate(-6deg) scale(0.92); opacity: 0.8; background: #E5F3FF; left: -4px; top: 2px; }
        .folder.back2 { transform: rotate(4deg) scale(0.88); opacity: 0.6; background: #DCEAF6; right: -4px; top: 4px; }
        .folder.front {
            transform: rotate(0deg);
            z-index: 2;
            background: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(77,163,245,0.25);
        }
        .folder.front svg { width: 30px; height: 30px; color: #fff; stroke: #fff; fill: none; stroke-width: 1.6; }
        .mini-orbit {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(77,163,245,0.2);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: miniOrbitSpin 12s linear infinite;
        }
        .mini-orbit-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--purple);
            box-shadow: 0 0 6px rgba(77,163,245,0.3);
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
        }
        @keyframes miniOrbitSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .big-cat-card .cat-label {
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text);
            position: relative;
            z-index: 3;
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
        .section-header h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
        .section-header .see-all {
            font-size: 0.78rem;
            color: var(--purple-light);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }
        .section-header .see-all:hover { color: var(--purple); }
        .h-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: x proximity;
        }
        .h-scroll::-webkit-scrollbar { display: none; }
        .item-card {
            flex-shrink: 0;
            width: 170px;
            background: #fff;
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            scroll-snap-align: start;
            box-shadow: 0 4px 12px rgba(40,100,150,0.04);
        }
        .item-card:hover, .item-card:active {
            border-color: var(--purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40,100,150,0.08);
        }
        .item-card .item-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .item-card .item-avatar svg {
            width: 22px;
            height: 22px;
            color: var(--purple);
            stroke: var(--purple);
            fill: none;
            stroke-width: 1.6;
        }
        .item-card .item-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--purple-light);
            font-weight: 600;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .item-card .item-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-card .item-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-card .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .item-meta-users { display: flex; align-items: center; gap: 3px; }
        .item-meta-users svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
        .item-card .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
            z-index: 2;
        }
        .item-card .fav-btn:hover { background: var(--bg-secondary); color: var(--purple); }
        .item-card .fav-btn.faved { color: #fff; background: var(--purple); border-color: var(--purple); }
        .item-card .fav-btn svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .catalog-grid .item-card { width: auto; }
        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
            transition: var(--transition);
            padding: 6px 0;
        }
        .detail-back:hover { color: var(--purple); }
        .detail-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 8px 30px rgba(40,100,150,0.08);
        }
        .detail-avatar {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            margin: 0 auto 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-avatar svg { width: 34px; height: 34px; color: var(--purple); stroke: var(--purple); fill: none; stroke-width: 1.6; }
        .detail-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 14px;
            background: var(--bg-secondary);
            color: var(--purple-light);
            margin: 6px 0;
        }
        .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .detail-tag {
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 14px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-open {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 32px;
            border-radius: 14px;
            background: var(--purple);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-open:hover, .btn-open:active { background: var(--purple-light); transform: translateY(-1px); }
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-secondary);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple);
        }
        .profile-avatar svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .stat-row { display: flex; gap: 16px; justify-content: center; margin: 14px 0; }
        .stat-box {
            text-align: center;
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(40,100,150,0.04);
        }
        .notif-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            align-items: center;
            box-shadow: 0 2px 8px rgba(40,100,150,0.04);
        }
        .notif-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--purple); flex-shrink: 0; }
        #toast {
            position: fixed;
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 30px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #fff;
            color: var(--text);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(40,100,150,0.12);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--max-width);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 10px var(--safe-bottom);
            z-index: 100;
            height: var(--nav-height);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            font-size: 0.6rem;
            font-weight: 500;
            position: relative;
            padding: 4px 8px;
            border-radius: 10px;
        }
        .nav-item.active { color: var(--purple-light); }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; transition: var(--transition); }
        .nav-orbita {
            position: relative;
            top: -18px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 3px solid #fff;
            box-shadow: 0 4px 12px rgba(77,163,245,0.3);
        }
        .nav-orbita:hover, .nav-orbita:active { background: var(--purple-light); transform: scale(1.04); }
        .nav-orbita svg { width: 28px; height: 28px; color: #fff; stroke: #fff; fill: none; stroke-width: 2; }

        @media (min-width: 768px) {
            .big-cats { grid-template-columns: repeat(4, 1fr); }
            .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .item-card { width: 190px; }
            .page { padding: 16px 24px 0; }
            .header { padding: calc(14px + var(--safe-top)) 24px 14px; }
        }
        @media (min-width: 1024px) {
            #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-rocket-container">
                <div class="splash-orbit"></div>
                <div class="splash-rocket">
                    <svg viewBox="0 0 24 24" fill="none">

                render();

                if (state.currentPage === 'detail') {
                    const catNav = bottomNav.querySelector('.nav-item[data-page="catalog"]');
                    if (catNav) catNav.classList.add('active');
                }
            }

                    const typeMap = { 'channels': 'channel', 'groups': 'group', 'bots': 'bot', 'miniapps': 'miniapp' };
                    const targetType = typeMap[state.currentCategory] || state.currentCategory;
                    filtered = filtered.filter(i => i.type === targetType);
                }
                if (state.searchQuery.trim()) {
                    const q = state.searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(i =>
                        i.name.toLowerCase().includes(q) ||
                        i.description.toLowerCase().includes(q) ||
                        i.category.toLowerCase().includes(q) ||
                        i.tags.some(t => t.toLowerCase().includes(q))
                    );
                }
                if (state.sort === 'popular') {
                    filtered.sort((a, b) => parseFloat(b.users) - parseFloat(a.users));
                } else if (state.sort === 'new') {
                    filtered.sort((a, b) => b.id - a.id);
                } else if (state.sort === 'alpha') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
                }
                return filtered;

                return [...items].sort((a, b) => parseFloat(b.users) - parseFloat(a.users)).slice(0, 8);

            }

            function renderCatalog() {
                const filtered = getFilteredItems();
                return `
            <div class="page" id="page-catalog">
              ${renderHeader()}
              <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:4px;">Каталог</h2>
              <div class="search-wrap" id="catalogSearchWrap">
                ${icons.search.replace('width="18"','width="18" class="search-icon-svg"')}
                <input class="search-input" type="text" placeholder="Поиск по каталогу..." value="${escapeHtml(state.searchQuery)}" oninput="window._orbita_search(this.value, 'catalog')" id="searchInputCat">
              </div>
              <div id="catalogDynamicContent">
                <div class="cat-scroll">${renderCategoryChips()}</div>
                <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;">
                  <span style="font-size:0.75rem;color:var(--text-muted);">Сортировка:</span>
                  <button class="cat-chip ${state.sort==='popular'?'active':''}" onclick="window._orbita_setSort('popular')" style="font-size:0.7rem;padding:6px 12px;">Популярные</button>
                  <button class="cat-chip ${state.sort==='new'?'active':''}" onclick="window._orbita_setSort('new')" style="font-size:0.7rem;padding:6px 12px;">Новые</button>
                  <button class="cat-chip ${state.sort==='alpha'?'active':''}" onclick="window._orbita_setSort('alpha')" style="font-size:0.7rem;padding:6px 12px;">По алфавиту</button>
                </div>
                <p style="font-size:0.75rem;color:var(--text-muted);margin:4px 0;">Найдено: ${filtered.length}</p>
                <div class="catalog-grid">
                  ${filtered.map(i => renderItemCard(i, true)).join('')}
                </div>
                ${filtered.length === 0 ? '<p style="text-align:center;color:var(--text-muted);padding:30px;">Ничего не найдено</p>' : ''}
              </div>
            </div>`;
            }

            function renderDetail() {
                const item = state.selectedItem;
                if (!item) { navigate('home'); return ''; }
                const isFav = state.favorites.includes(item.id);
                return `
            <div class="page" id="page-detail">
              ${renderHeader(true)}
              <div class="detail-card" style="margin-top:8px;">
                <div class="detail-avatar">${getTypeIcon(item.type)}</div>
                <h2 style="font-size:1.3rem;font-weight:700;">${item.name}</h2>
                ${item.verified ? '<span class="detail-badge">✓ Проверенный</span>' : ''}
                <p style="color:var(--text-secondary);margin:8px 0;">${item.description}</p>
                <p style="font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:4px;">${icons.users} ${item.users} подписчиков</p>
                <div style="margin:8px 0;font-size:0.8rem;color:var(--text-muted);">Категория: <strong>${item.category}</strong></div>
                <div class="detail-tags">${item.tags.map(t => `<span class="detail-tag">${t}</span>`).join('')}</div>
                <button class="btn-open" onclick="window._orbita_openExternal('${item.name}')">ОТКРЫТЬ</button>
                <div style="margin-top:12px;">
                  <button class="cat-chip ${isFav?'active':''}" onclick="window._orbita_toggleFav(${item.id});window._orbita_refreshDetail();" style="font-size:0.8rem;">
                    ${isFav ? '♥ В избранном' : '♡ Добавить в избранное'}
                  </button>
                </div>
              </div>
            </div>`;
            }

            function renderFavorites() {
                const favItems = items.filter(i => state.favorites.includes(i.id));
                return `
            <div class="page" id="page-favorites">
              ${renderHeader()}
              <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:8px;">Избранное</h2>
              ${favItems.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:40px;">Пока ничего нет в избранном</p>' : ''}
              <div class="catalog-grid">
                ${favItems.map(i => renderItemCard(i, true)).join('')}
              </div>
            </div>`;
            }

            function renderProfile() {
                const favCount = state.favorites.length;
                return `
            <div class="page" id="page-profile">
              ${renderHeader()}
              <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:4px;">Мой профиль</h2>
              <div class="profile-avatar">${icons.user.replace('width="18"','width="36"').replace('height="18"','height="36"')}</div>
              <p style="text-align:center;font-weight:700;font-size:1.1rem;">Гость</p>
              <div class="stat-row">
                <div class="stat-box"><strong>${favCount}</strong><br><span style="font-size:0.7rem;color:var(--text-muted);">Избранное</span></div>
                <div class="stat-box"><strong>24</strong><br><span style="font-size:0.7rem;color:var(--text-muted);">Просмотрено</span></div>
              </div>
              <div style="margin-top:16px;">
                <p style="color:var(--text-secondary);font-size:0.85rem;padding:8px 0;">⚙️ Настройки</p>
                <p style="color:var(--text-secondary);font-size:0.85rem;padding:8px 0;">ℹ️ О приложении ORBITA v1.0</p>
              </div>
            </div>`;
            }

            function renderNotifications() {
                return `
            <div class="page" id="page-notifications">
              ${renderHeader()}
              <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:12px;">Уведомления</h2>
              <div class="notif-item"><div class="notif-dot"></div><div><strong>Новые каналы</strong><br><span style="font-size:0.75rem;color:var(--text-muted);">Добавлены 12 новых каналов</span></div></div>
              <div class="notif-item"><div class="notif-dot"></div><div><strong>Популярное</strong><br><span style="font-size:0.75rem;color:var(--text-muted);">Ваш сохранённый канал стал популярным</span></div></div>
              <div class="notif-item"><div class="notif-dot" style="background:#318BEA;"></div><div><strong>Обновление</strong><br><span style="font-size:0.75rem;color:var(--text-muted);">ORBITA получила новые функции</span></div></div>
            </div>`;
            }

            // Динамическое обновление
            function updateHomeContent() {
                const container = document.getElementById('homeDynamicContent');
                if (!container) return;
                const popular = getPopularItems();
                const filtered = getFilteredItems().slice(0, 12);
                container.innerHTML = `
              <div class="cat-scroll">${renderCategoryChips()}</div>
              <div class="big-cats">
                ${renderBigCatCard('channels', 'Каналы', icons.channel)}
                ${renderBigCatCard('groups', 'Группы', icons.group)}
                ${renderBigCatCard('bots', 'Боты', icons.bot)}
                ${renderBigCatCard('miniapps', 'Мини-аппы', icons.apps)}
              </div>
              <div class="section-header">
                <h3>Популярное</h3>
                <span class="see-all" onclick="window._orbita_navigate('catalog')">Смотреть всё →</span>
              </div>
              <div class="h-scroll">
                ${popular.map(i => renderItemCard(i, true)).join('')}
              </div>
              ${(state.searchQuery || state.currentCategory !== 'all') ? `
              <div class="section-header" style="margin-top:8px;">
                <h3>Результаты</h3>
              </div>
              <div class="catalog-grid">
                ${filtered.map(i => renderItemCard(i, true)).join('')}
              </div>
              ${filtered.length === 0 ? '<p style="text-align:center;color:var(--text-muted);padding:20px;">Ничего не найдено</p>' : ''}
              ` : ''}`;
            }

            function updateCatalogContent() {
                const container = document.getElementById('catalogDynamicContent');
                if (!container) return;
                const filtered = getFilteredItems();
                container.innerHTML = `
              <div class="cat-scroll">${renderCategoryChips()}</div>
              <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;">
                <span style="font-size:0.75rem;color:var(--text-muted);">Сортировка:</span>
                <button class="cat-chip ${state.sort==='popular'?'active':''}" onclick="window._orbita_setSort('popular')" style="font-size:0.7rem;padding:6px 12px;">Популярные</button>
                <button class="cat-chip ${state.sort==='new'?'active':''}" onclick="window._orbita_setSort('new')" style="font-size:0.7rem;padding:6px 12px;">Новые</button>
                <button class="cat-chip ${state.sort==='alpha'?'active':''}" onclick="window._orbita_setSort('alpha')" style="font-size:0.7rem;padding:6px 12px;">По алфавиту</button>
              </div>
              <p style="font-size:0.75rem;color:var(--text-muted);margin:4px 0;">Найдено: ${filtered.length}</p>
              <div class="catalog-grid">
                ${filtered.map(i => renderItemCard(i, true)).join('')}
              </div>
              ${filtered.length === 0 ? '<p style="text-align:center;color:var(--text-muted);padding:30px;">Ничего не найдено</p>' : ''}`;
            }

            function updateCurrentPageContent() {
                if (state.currentPage === 'home') updateHomeContent();
                else if (state.currentPage === 'catalog') updateCatalogContent();
            }

            // Глобальные функции
            window._orbita_navigate = function(page) { navigate(page); };
            window._orbita_openItem = function(id) {
                const item = items.find(i => i.id === id);
                if (item) navigate('detail', item);
            };
            window._orbita_toggleFav = function(id) {
                const idx = state.favorites.indexOf(id);
                if (idx > -1) {
                    state.favorites.splice(idx, 1);
                    showToast('Удалено из избранного');
                } else {
                    state.favorites.push(id);
                    showToast('Добавлено в избранное');
                }
                saveFavorites();
                if (state.currentPage === 'detail') render();
                else updateCurrentPageContent();
            };
            window._orbita_search = function(val, source) {
                state.searchQuery = val;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    if (state.currentPage === 'detail') navigate('catalog');
                    else updateCurrentPageContent();
                }, 150);
            };
            window._orbita_setCategory = function(cat) {
                state.currentCategory = cat;
                if (state.currentPage === 'detail') navigate('catalog');
                else updateCurrentPageContent();
            };
            window._orbita_filterCat = function(cat) {
                state.currentCategory = cat;
                navigate('catalog');
            };
            window._orbita_setSort = function(sort) {
                state.sort = sort;
                updateCurrentPageContent();
            };
            window._orbita_goBack = function() {
                if (state.selectedItem) {
                    const itemType = state.selectedItem.type;
                    const typeMap = { channel: 'channels', group: 'groups', bot: 'bots', miniapp: 'miniapps' };
                    state.currentCategory = typeMap[itemType] || 'all';
                }
                navigate('catalog');
            };
            window._orbita_refreshDetail = function() { render(); };
            window._orbita_openExternal = function(name) {
                showToast('Открывается: ' + name);
            };

            bottomNav.addEventListener('click', function(e) {
                const navItem = e.target.closest('.nav-item');
                const orbitaBtn = e.target.closest('.nav-orbita');
                if (navItem) {
                    const page = navItem.dataset.page;
                    if (page) {
                        state.currentCategory = 'all';
                        state.searchQuery = '';
                        navigate(page);
                    }
                }
                if (orbitaBtn) {
                    state.currentCategory = 'all';
                    state.searchQuery = '';
                    navigate('home');
                }
            });

            function render() {
                let html = '';
                switch (state.currentPage) {
                    case 'home': html = renderHome(); break;
                    case 'catalog': html = renderCatalog(); break;
                    case 'detail': html = renderDetail(); break;
                    case 'favorites': html = renderFavorites(); break;
                    case 'profile': html = renderProfile(); break;
                    case 'notifications': html = renderNotifications(); break;
                    default: html = renderHome();
                }
                app.innerHTML = html;
            }

            // Инициализация приложения и скрытие сплэша
            navigate('home');

            // Через 7 секунд скрываем экран загрузки
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('splash-hidden');
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 500);
                }
            }, 7000);
        })();
    </script>
</body>
</html>
