<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>Моё меню</title>
<style>
:root{--bg:#fffaf6;--card:#fff;--ink:#202020;--muted:#81776f;--accent:#e87542;--accent2:#f4a261;--line:#eee3da;--soft:#fff0e6;--green:#4e9a6b;--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding-bottom:38px}.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(255,250,246,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(238,227,218,.7);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px;letter-spacing:-.04em}.count{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:99px}
main{padding:0 16px}.hero{padding:28px 6px 20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:36px;line-height:1.02;letter-spacing:-.055em;margin:8px 0 10px}.home{position:relative;overflow:hidden;padding:42px 18px 26px;text-align:center;border-radius:30px;background:radial-gradient(circle at 12% 8%,rgba(232,117,66,.18),transparent 28%),radial-gradient(circle at 92% 20%,rgba(244,162,97,.18),transparent 30%),linear-gradient(145deg,#fffdfb 0%,#fff6ef 48%,#fffaf6 100%);border:1px solid rgba(232,117,66,.12);box-shadow:0 18px 50px rgba(80,50,30,.08)}.home:before,.home:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.home:before{width:150px;height:150px;right:-75px;bottom:-55px;background:rgba(232,117,66,.08)}.home:after{width:110px;height:110px;left:-55px;top:145px;background:rgba(244,162,97,.08)}.home>*{position:relative;z-index:1}.avatar{width:104px;height:104px;border-radius:50%;margin:4px auto 12px;background:#fff0e6;border:3px solid #fff;box-shadow:0 8px 24px rgba(70,45,30,.1);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.user-name{font-size:18px;font-weight:800;margin-bottom:34px}.home-buttons{display:grid;gap:10px}.home-btn{position:relative;width:100%;min-height:54px;border-radius:17px;background:rgba(255,255,255,.82);border:1px solid rgba(232,117,66,.14);color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 7px 20px rgba(70,45,30,.06);backdrop-filter:blur(8px);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.home-btn:hover{background:#fff;box-shadow:0 10px 25px rgba(70,45,30,.09)}.home-btn:active{transform:scale(.985)}.page-title{font-size:30px;line-height:1.05;letter-spacing:-.045em;margin:4px 0 16px}.page-title-icon{margin-right:4px}.home-btn.time{background:var(--ink);color:#fff;border-color:var(--ink)}.catalog-view{display:none}.catalog-view.show{display:block}.back{margin:4px 0 14px;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800}.hero p{color:var(--muted);margin:0;line-height:1.55;font-size:15px}
.search{position:relative;margin:4px 0 16px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px 14px 44px;outline:none;color:var(--ink);box-shadow:0 8px 25px rgba(80,50,30,.04)}.search input:focus{border-color:#e9a17d;box-shadow:0 0 0 4px #fff0e6}.search span{position:absolute;left:16px;top:13px;font-size:18px}
.subtabs{display:flex;gap:7px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}.subtab{white-space:nowrap;padding:8px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700}.subtab.active{background:var(--soft);border-color:#f2c5ac;color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(70,45,30,.045);transition:.18s}.card:active{transform:scale(.985)}.photo{height:125px;background:linear-gradient(135deg,#ffe0cb,#fff4e9);display:flex;align-items:center;justify-content:center;font-size:45px;position:relative}.num{position:absolute;top:9px;left:9px;background:rgba(255,255,255,.88);padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800;color:#75685e}.body{padding:12px}.cat{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.name{font-size:15px;font-weight:800;line-height:1.2;margin:4px 0 7px;letter-spacing:-.02em}.meta{font-size:11px;color:var(--muted);line-height:1.5}.open{width:100%;margin-top:10px;padding:9px;border-radius:11px;background:var(--soft);color:var(--accent);font-weight:800;font-size:12px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(20,16,13,.48);z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:92dvh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}.sheet-head{position:sticky;top:0;background:rgba(255,250,246,.94);backdrop-filter:blur(16px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.close{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px}.detail-photo{height:220px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd8c0,#fff1e6);font-size:76px}.detail{padding:20px 18px}.detail .cat{font-size:11px}.detail h2{font-size:29px;line-height:1.05;letter-spacing:-.045em;margin:6px 0 14px}.nutrition{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 22px}.nut{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}.nut b{display:block;font-size:15px}.nut span{font-size:10px;color:var(--muted)}.section{font-weight:850;font-size:16px;margin:20px 0 9px}.ingredients{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 16px}.ingredients div{padding:10px 0;border-bottom:1px solid #f1e9e2;font-size:14px}.ingredients div:last-child{border:0}.steps{padding-left:20px;color:#4c4540;line-height:1.65;font-size:14px}.steps li{margin:9px 0}
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.gate.show{display:flex}.gate-box{max-width:420px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px 22px;box-shadow:0 20px 60px rgba(70,45,30,.08)}.gate-icon{font-size:48px}.gate h2{font-size:28px;letter-spacing:-.04em;margin:12px 0 8px}.gate p{color:var(--muted);line-height:1.55;font-size:14px}.buy{width:100%;padding:15px;border-radius:15px;background:var(--ink);color:#fff;font-weight:850;margin-top:14px}.bonus{margin-top:10px;color:var(--muted);font-size:11px}
@keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}@media(min-width:620px){main{padding:0 22px}.hero{text-align:center;padding-top:42px}.grid{grid-template-columns:repeat(3,1fr)}.photo{height:145px}.modal{align-items:center;padding:20px}.sheet{border-radius:26px;max-height:88dvh}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🍓 Моё меню</div></header>
<main>
<section class="hero"><div class="home" id="home"><div class="avatar" id="avatar">🥑</div><div class="user-name" id="userName">Добро пожаловать 🤎</div><div class="home-buttons"><button class="home-btn time" id="timeBtn">🕐 Что по времени</button><button class="home-btn" data-home-cat="Завтраки">🍳 Завтраки</button><button class="home-btn" data-home-cat="Обеды">🍲 Обеды</button><button class="home-btn" data-home-cat="Ужины">🥗 Ужин</button></div></div></section>
<div class="catalog-view" id="catalog"><button class="back" id="back">← Назад</button><h2 class="page-title" id="pageTitle">🍳 Завтраки</h2><div class="search"><span>⌕</span><input id="search" placeholder="Найти блюдо..." autocomplete="off"></div>
<div class="subtabs" id="subtabs" hidden></div>
<section class="grid" id="grid"></section><div class="empty" id="empty" hidden><b>Ничего не нашли</b>Попробуйте изменить запрос.</div></div>
</main>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><b>Рецепт</b><button class="close" id="close">×</button></div><div id="detail"></div></div></div>
<div class="gate" id="gate"><div class="gate-box"><div class="gate-icon">🍽️</div><h2>Ваше меню готово</h2><p>После покупки здесь откроются все 60 рецептов: блюда, фотографии, граммовки, калории, БЖУ и подробное приготовление.</p><button class="buy" id="buy">🔐 Получить доступ · 1 490 ₽</button><div class="bonus">После оплаты бот выдаст персональную ссылку на меню</div></div></div>
<script>
const emojis=['🥞','🍳','🥣','🥑','🧇','🍓','🥪','🍌','🥚','🫐','🍚','🍝','🍗','🥘','🌯','🍲','🍛','🥙','🍜','🥩','🐟','🥗','🍤','🌮','🍱','🥔','🍅','🫘','🍚','🥦'];
const names=[
'Овсяноблин с курицей','Омлет с овощами','Йогурт с ягодами и гранолой','Тост с авокадо и яйцом','Сырники с ягодами','Овсянка с бананом','Тост с творожным сыром','Творожная миска с фруктами','Яичница с индейкой','Чиа-пудинг с ягодами',
'Паста с курицей','Гречка с куриной грудкой','Рис с индейкой и овощами','Курица терияки с рисом','Булгур с говядиной','Паста с тунцом','Гречка с грибами и курицей','Лаваш с курицей и овощами','Суп-пюре с курицей','Картофель с индейкой','Рис с лососем','Гуляш из говядины','Куриное карри','Тефтели с гречкой','Боул с курицей','Паста болоньезе','Курица с овощами','Чечевица с индейкой','Рис с курицей','Котлеты из индейки',
'Салат с тунцом','Салат с курицей и овощами','Запечённая рыба с овощами','Куриная грудка с брокколи','Тёплый салат с индейкой','Овощной боул с яйцом','Творожный омлет','Рулетики из курицы с сыром','Запечённая индейка с овощами','Салат с креветками',
'Треска с картофелем','Курица с кабачками','Гречневые котлеты с салатом','Лосось с брокколи','Индейка с цветной капустой','Тёплая чечевица с овощами','Куриные шашлычки с салатом','Фриттата с овощами','Салат с яйцом и авокадо','Тунец с рисом',
'Курица в сливочном соусе','Запеканка из творога','Овощи с фетой и яйцом','Креветки с овощами','Индейка с грибами','Куриные котлеты с пюре','Рыба с рисом и салатом','Овощная шакшука','Творог с ягодами','Салат с курицей и авокадо'
];
const cats=[...Array(20).fill('Завтраки'),...Array(20).fill('Обеды'),...Array(20).fill('Ужины')];
const recipes=names.map((name,i)=>({id:i+1,name,cat:cats[i],emoji:emojis[i%emojis.length],kcal:390+(i%8)*27,b:28+(i%6)*3,j:12+(i%5)*2,u:25+(i%7)*4,ingredients:['яйца — 2 шт.','основной продукт — 100 г','овощи — 150 г','сыр или соус — 30 г'],steps:['Подготовьте и нарежьте ингредиенты.','Приготовьте основной продукт до готовности.','Добавьте овощи и остальные ингредиенты.','Перемешайте, прогрейте и подавайте.']}));
let active='all',query='',subfilter='all';
const home=document.querySelector('#home'),catalog=document.querySelector('#catalog'),avatar=document.querySelector('#avatar'),userName=document.querySelector('#userName');
function initTelegramUser(){const tg=window.Telegram?.WebApp;const user=tg?.initDataUnsafe?.user;if(!user)return;if(user.photo_url)avatar.innerHTML=`<img src="${user.photo_url}" alt="Аватар пользователя">`;else avatar.textContent=(user.first_name||'П').slice(0,1).toUpperCase();userName.textContent=[user.first_name,user.last_name].filter(Boolean).join(' ')||'Добро пожаловать 🤎'}
function openCatalog(cat){active=cat;subfilter='all';query='';document.querySelector('#pageTitle').textContent=cat==='Завтраки'?'🍳 Завтраки':cat==='Обеды'?'🍲 Обеды':'🥗 Ужин';document.querySelector('#search').value='';home.style.display='none';catalog.classList.add('show');renderSubtabs();render();window.scrollTo({top:0,behavior:'smooth'})}
function openByTime(){const h=new Date().getHours();openCatalog(h>=5&&h<11?'Завтраки':h>=11&&h<17?'Обеды':'Ужины')}
const filters={Завтраки:[['all','Все завтраки'],['lactose','Без лактозы'],['gluten','Без глютена'],['protein','Высокобелковые'],['quick','Быстрые']],Обеды:[['all','Все обеды'],['lactose','Без лактозы'],['gluten','Без глютена'],['protein','Высокобелковые'],['quick','Быстрые']],Ужины:[['all','Все ужины'],['lactose','Без лактозы'],['gluten','Без глютена'],['protein','Высокобелковые'],['light','Лёгкие']]};
function renderSubtabs(){const el=document.querySelector('#subtabs');if(active==='all'){el.hidden=true;el.innerHTML='';return}el.hidden=false;el.innerHTML=filters[active].map(([id,label])=>`<button class="subtab ${subfilter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}
const grid=document.querySelector('#grid'),empty=document.querySelector('#empty');
function render(){const list=recipes.filter(r=>(active==='all'||r.cat===active)&&matchesFilter(r,subfilter)&&r.name.toLowerCase().includes(query.toLowerCase()));grid.innerHTML=list.map(r=>`<article class="card" data-id="${r.id}"><div class="photo"><span class="num">№${String(r.id).padStart(2,'0')}</span>${r.emoji}</div><div class="body"><div class="cat">${r.cat}</div><div class="name">${r.name}</div><div class="meta">${r.kcal} ккал · Б ${r.b} · Ж ${r.j} · У ${r.u}</div><button class="open">Открыть рецепт</button></div></article>`).join('');empty.hidden=!!list.length}
function matchesFilter(r,f){if(f==='all')return true;const n=r.name.toLowerCase();if(f==='lactose')return !/сыр|творог|сливоч|йогурт|фет/.test(n);if(f==='gluten')return !/паста|лаваш|булгур|овсян|тост|хлеб/.test(n);if(f==='protein')return r.b>=40;if(f==='quick')return r.id%3!==0;if(f==='light')return r.kcal<=500;return true}
function openRecipe(r){document.querySelector('#detail').innerHTML=`<div class="detail-photo">${r.emoji}</div><div class="detail"><div class="cat">${r.cat}</div><h2>${r.name}</h2><div class="nutrition"><div class="nut"><b>${r.kcal}</b><span>ккал</span></div><div class="nut"><b>${r.b} г</b><span>белки</span></div><div class="nut"><b>${r.j} г</b><span>жиры</span></div><div class="nut"><b>${r.u} г</b><span>углеводы</span></div></div><div class="section">Ингредиенты</div><div class="ingredients">${r.ingredients.map(x=>'<div>'+x+'</div>').join('')}</div><div class="section">Приготовление</div><ol class="steps">${r.steps.map(x=>'<li>'+x+'</li>').join('')}</ol></div>`;document.querySelector('#modal').classList.add('show')}
document.querySelector('#grid').addEventListener('click',e=>{const card=e.target.closest('.card');if(card)openRecipe(recipes.find(r=>r.id==card.dataset.id))});
document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});
document.querySelector('#search').oninput=e=>{query=e.target.value;render()};
document.querySelector('#subtabs').addEventListener('click',e=>{if(!e.target.dataset.filter)return;subfilter=e.target.dataset.filter;document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x===e.target));render()});
document.querySelector('#buy').onclick=()=>{window.location.href='https://t.me/';};
document.querySelector('#timeBtn').onclick=openByTime;
document.querySelectorAll('[data-home-cat]').forEach(b=>b.onclick=()=>openCatalog(b.dataset.homeCat));
document.querySelector('#back').onclick=()=>{catalog.classList.remove('show');home.style.display='block';window.scrollTo({top:0,behavior:'smooth'})};
const tgScript=document.createElement('script');tgScript.src='https://telegram.org/js/telegram-web-app.js';tgScript.onload=initTelegramUser;document.head.appendChild(tgScript);
initTelegramUser();renderSubtabs();render();
</script>
</body>
</html>
