(()=>{const avatarEl=document.querySelector('#avatar');const open=()=>{if(typeof window.openZiraAdmin==='function'){window.openZiraAdmin();return}location.hash='admin'};avatarEl?.addEventListener('click',open);})();

<script>
(()=>{const A={view:document.querySelector('#adminView'),login:document.querySelector('#adminLoginPanel'),content:document.querySelector('#adminContent'),pass:null,list:document.querySelector('#adminList'),search:document.querySelector('#adminSearch'),id:document.querySelector('#adminId'),name:document.querySelector('#adminName'),emoji:document.querySelector('#adminEmoji'),cat:document.querySelector('#adminCat'),image:document.querySelector('#adminImage'),filters:document.querySelector('#adminFilters'),kcal:document.querySelector('#adminKcal'),b:document.querySelector('#adminB'),j:document.querySelector('#adminJ'),u:document.querySelector('#adminU'),ingredients:document.querySelector('#adminIngredients'),steps:document.querySelector('#adminSteps'),del:document.querySelector('#adminDelete'),title:document.querySelector('#adminFormTitle')};const opts={Завтраки:[['protein','Высокобелковые'],['carbs','Высокоуглеводные'],['oatmeal','Овсянка'],['eggs','Яйца'],['cottage','Творог']],Обеды:[['fish','Рыба'],['meat','Мясо'],['chicken','Курица'],['seafood','Морепродукты'],['airfryer','Аэрогриль'],['oven','Духовка']],Ужины:[['fish','Рыба'],['meat','Мясо'],['seafood','Морепродукты'],['airfryer','Аэрогриль'],['oven','Духовка']],Десерты:[['lowcal','Низкокалорийные'],['lactose','Без лактозы'],['nosugar','Без сахара'],['quick','Быстрые']],Салаты:[['protein','Высокобелковые'],['chicken','С курицей'],['seafood','С морепродуктами']]};let data=[];function setFilters(selected=[]){A.filters.innerHTML=(opts[A.cat.value]||[]).map(([id,label])=>'<label class="admin-filter"><input type="checkbox" value="'+id+'" '+(selected.includes(id)?'checked':'')+'> '+label+'</label>').join('')||'<div style="font-size:12px;color:var(--muted)">Для этой категории фильтров нет.</div>'}function clearForm(){A.id.value='';A.name.value='';A.emoji.value='🍽️';A.cat.value='Завтраки';A.image.value='';A.kcal.value='';A.b.value='';A.j.value='';A.u.value='';A.ingredients.value='';A.steps.value='';A.title.textContent='Добавить блюдо';A.del.hidden=true;setFilters([])}function edit(r){A.id.value=r.id;A.name.value=r.name;A.emoji.value=r.emoji||'🍽️';A.cat.value=r.cat;A.image.value=r.image||'';A.kcal.value=r.kcal||'';A.b.value=r.b||'';A.j.value=r.j||'';A.u.value=r.u||'';A.ingredients.value=(r.ingredients||[]).join('\n');A.steps.value=(r.steps||[]).join('\n');A.title.textContent='Редактировать блюдо';A.del.hidden=false;setFilters(r.filters||[]);A.view.scrollIntoView({behavior:'smooth'})}function draw(){const q=(A.search.value||'').toLowerCase();const list=data.filter(r=>r.name.toLowerCase().includes(q));A.list.innerHTML=list.length?list.map(r=>'<div class="admin-item"><div class="admin-item-main"><div class="admin-item-name">'+r.emoji+' '+r.name+'</div><div class="admin-item-meta">'+r.cat+' · '+(r.filters||[]).join(', ')+'</div></div><button class="admin-secondary" data-edit="'+r.id+'">Изменить</button>'+(Number(r.id)>80?'<button class="admin-danger" data-delete="'+r.id+'">Удалить</button>':'')+'</div>').join(''):'<div class="admin-empty">Блюд не найдено</div>'}function initData(){return window.Telegram?.WebApp?.initData||''}async function load(){const init=initData();if(!init)throw new Error('Откройте админ-панель внутри Telegram');const res=await fetch('/api/admin/recipes',{headers:{'x-telegram-init-data':init}});const j=await res.json();if(!res.ok)throw new Error(j.error||'Доступ запрещён');data=j.recipes||[];A.login.hidden=true;A.content.hidden=false;draw()}async function save(action,payload){const init=initData();const res=await fetch('/api/admin/recipes',{method:'POST',headers:{'Content-Type':'application/json','x-telegram-init-data':init},body:JSON.stringify({action,...payload})});const j=await res.json();if(!res.ok)throw new Error(j.error||'Ошибка');data=j.recipes||data;recipes=data;draw();renderSubtabs();render();return j}function collect(){const r={id:A.id.value?Number(A.id.value):0,name:A.name.value.trim(),emoji:A.emoji.value.trim()||'🍽️',cat:A.cat.value,image:A.image.value.trim(),kcal:Number(A.kcal.value)||0,b:Number(A.b.value)||0,j:Number(A.j.value)||0,u:Number(A.u.value)||0,filters:[...A.filters.querySelectorAll('input:checked')].map(x=>x.value),ingredients:A.ingredients.value.split('\n').map(x=>x.trim()).filter(Boolean),steps:A.steps.value.split('\n').map(x=>x.trim()).filter(Boolean)};if(!r.name)throw new Error('Введите название блюда');return r}async function enter(){try{await load()}catch(e){A.login.hidden=false;A.content.hidden=true;A.login.querySelector('div').innerHTML='<label>Доступ к админ-панели</label><div style="font-size:14px;font-weight:800">'+e.message+'</div>'}}function open(){A.view.classList.add('show');home.style.display='none';catalog.classList.remove('show');delete document.body.dataset.category;window.scrollTo({top:0,behavior:'auto'});load().catch(e=>{A.login.hidden=false;A.content.hidden=true;const box=A.login.querySelector('div');if(box)box.innerHTML='<label>Доступ к админ-панели</label><div style="font-size:14px;font-weight:800;line-height:1.45">Ошибка проверки Telegram: '+String(e?.message||e)+'</div><div style="font-size:12px;font-weight:500;opacity:.7;margin-top:8px">initData: '+(initData()?'получен':'НЕ получен')+'</div>'})}window.openZiraAdmin=open;function close(){A.view.classList.remove('show');home.style.display='block'}A.cat.onchange=()=>setFilters([]);A.search.oninput=draw;document.querySelector('#adminNew').onclick=()=>{clearForm();A.name.focus();};document.querySelector('#emojiPicker').addEventListener('click',e=>{const b=e.target.closest('[data-emoji]');if(!b)return;A.emoji.value=b.dataset.emoji;A.emoji.focus();});document.querySelector('#adminSave').onclick=async()=>{try{await save('save',{recipe:collect()});clearForm();alert('Блюдо сохранено');}catch(e){alert(e.message)}};A.del.onclick=async()=>{if(!A.id.value||!confirm('Удалить это блюдо?'))return;try{await save('delete',{id:Number(A.id.value)});clearForm();alert('Блюдо удалено')}catch(e){alert(e.message)}};A.list.onclick=async e=>{const del=e.target.closest('[data-delete]');if(del){const r=data.find(x=>Number(x.id)===Number(del.dataset.delete));if(!r||!confirm('Удалить блюдо «'+r.name+'»?'))return;try{await save('delete',{id:Number(r.id)});if(!A.id.value||Number(A.id.value)===Number(r.id))clearForm();alert('Блюдо удалено')}catch(err){alert(err.message)}return}const b=e.target.closest('[data-edit]');if(b)edit(data.find(r=>Number(r.id)===Number(b.dataset.edit)))};document.querySelector('#adminBack').onclick=()=>{location.hash='';close();renderSubtabs();render();window.scrollTo({top:0,behavior:'smooth'});};window.addEventListener('hashchange',()=>location.hash==='#admin'?open():close());if(location.hash==='#admin')open();fetch('/api/recipes?ts='+Date.now(),{cache:'no-store'}).then(async x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.json()}).then(j=>{if(!Array.isArray(j.recipes))throw new Error('Каталог не получен');recipes=j.recipes;renderSubtabs();render()}).catch(e=>console.error('Catalog API error:',e));})();
</script>
