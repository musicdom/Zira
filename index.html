<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORBITA — Каталог MAX</title>
    <style>
        :root {
            --bg: #F5FAFF;
            --bg-secondary: #E5F3FF;
            --bg-card: #FFFFFF;
            --purple: #4DA3F5;
            --purple-light: #318BEA;
            --pink: #4DA3F5;
            --pink-light: #E5F3FF;
            --text: #172536;
            --text-secondary: #718398;
            --text-muted: #A0B8CC;
            --border: #DCEAF6;
            --glow-purple: rgba(77, 163, 245, 0.08);
            --glow-pink: rgba(77, 163, 245, 0.08);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --nav-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
            --safe-top: env(safe-area-inset-top, 0px);
            --max-width: 1200px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            height: 100%;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            line-height: 1.4;
            letter-spacing: -0.01em;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === SPLASH SCREEN === */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #F5FAFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        #splash-screen.splash-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-content {
            text-align: center;
            position: relative;
        }
        .splash-scene {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            position: relative;
        }
        .splash-scene svg {
            width: 100%;
            height: 100%;
        }
        .splash-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .splash-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 24px;
        }
        .splash-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4DA3F5;
            animation: splash-blink 1.2s infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: 0.2s; }
        .splash-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes splash-blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* === ОСНОВНОЙ ИНТЕРФЕЙС === */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(77, 163, 245, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(77, 163, 245, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(200, 230, 255, 0.3) 0%, transparent 70%);
        }
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--max-width);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + var(--safe-top)) 18px 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text);
            cursor: pointer;
        }
        .header-logo svg { width: 32px; height: 32px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            position: relative;
        }
        .icon-btn:hover, .icon-btn:active { background: var(--bg-secondary); color: var(--purple-light); }
        .icon-btn .badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--purple);
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
        }
        .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .page { flex: 1; padding: 10px 16px 0; animation: pageIn 0.2s ease-out; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .hero { text-align: center; padding: 10px 0 14px; }
        .hero h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text); margin-bottom: 2px; }
        .hero .subtitle { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.01em; }
        .hero .tags-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .hero .tag-pill {
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--bg-secondary);
            color: var(--purple-light);
            border: 1px solid var(--border);
            white-space: nowrap;
        }
        .search-wrap { position: relative; margin: 6px 0 14px; }
        .search-input {
            width: 100%;
            padding: 13px 18px 13px 44px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.01em;
            -webkit-user-select: text;
            user-select: text;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(77,163,245,0.1); }
        .search-icon-svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .search-clear.show { opacity: 1; pointer-events: auto; }
        .search-clear svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
        .cat-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-wrap: nowrap;
        }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }
        .cat-chip.active {
            background: var(--purple);
            border-color: var(--purple);
            color: #fff;
            box-shadow: 0 2px 8px rgba(77,163,245,0.2);
        }
        .big-cats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .big-cat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 18px 14px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(40,100,150,0.06);
        }
        .big-cat-card:hover, .big-cat-card:active {
            border-color: var(--purple);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(40,100,150,0.1);
        }
        .folder-stack { position: relative; width: 70px; height: 70px; margin-bottom: 12px; }
        .folder {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--bg-secondary);
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: var(--transition);
        }
        .folder.back1 { transform: rotate(-6deg) scale(0.92); opacity: 0.8; background: #E5F3FF; left: -4px; top: 2px; }
        .folder.back2 { transform: rotate(4deg) scale(0.88); opacity: 0.6; background: #DCEAF6; right: -4px; top: 4px; }
        .folder.front {
            transform: rotate(0deg);
            z-index: 2;
            background: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(77,163,245,0.25);
        }
        .folder.front svg { width: 30px; height: 30px; color: #fff; stroke: #fff; fill: none; stroke-width: 1.6; }
        .mini-orbit {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(77,163,245,0.2);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: miniOrbitSpin 12s linear infinite;
        }
        .mini-orbit-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--purple);
            box-shadow: 0 0 6px rgba(77,163,245,0.3);
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
        }
        @keyframes miniOrbitSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .big-cat-card .cat-label {
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text);
            position: relative;
            z-index: 3;
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
        .section-header h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
        .section-header .see-all {
            font-size: 0.78rem;
            color: var(--purple-light);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }
        .section-header .see-all:hover { color: var(--purple); }
        .h-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: x proximity;
        }
        .h-scroll::-webkit-scrollbar { display: none; }
        .item-card {
            flex-shrink: 0;
            width: 170px;
            background: #fff;
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            scroll-snap-align: start;
            box-shadow: 0 4px 12px rgba(40,100,150,0.04);
        }
        .item-card:hover, .item-card:active {
            border-color: var(--purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40,100,150,0.08);
        }
        .item-card .item-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .item-card .item-avatar svg {
            width: 22px;
            height: 22px;
            color: var(--purple);
            stroke: var(--purple);
            fill: none;
            stroke-width: 1.6;
        }
        .item-card .item-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--purple-light);
            font-weight: 600;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .item-card .item-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-card .item-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-card .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .item-meta-users { display: flex; align-items: center; gap: 3px; }
        .item-meta-users svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
        .item-card .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
            z-index: 2;
        }
        .item-card .fav-btn:hover { background: var(--bg-secondary); color: var(--purple); }
        .item-card .fav-btn.faved { color: #fff; background: var(--purple); border-color: var(--purple); }
        .item-card .fav-btn svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
        .item-card .fav-btn.heart-pop {
            animation: heartPop 0.3s ease;
        }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .catalog-grid .item-card { width: auto; }
        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
            transition: var(--transition);
            padding: 6px 0;
        }
        .detail-back:hover { color: var(--purple); }
        .detail-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 8px 30px rgba(40,100,150,0.08);
        }
        .detail-avatar {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            margin: 0 auto 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-avatar svg { width: 34px; height: 34px; color: var(--purple); stroke: var(--purple); fill: none; stroke-width: 1.6; }
        .detail-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 14px;
            background: var(--bg-secondary);
            color: var(--purple-light);
            margin: 6px 0;
        }
        .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .detail-tag {
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 14px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-open {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 32px;
            border-radius: 14px;
            background: var(--purple);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-open:hover, .btn-open:active { background: var(--purple-light); transform: translateY(-1px); }
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-secondary);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple);
        }
        .profile-avatar svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .stat-row { display: flex; gap: 16px; justify-content: center; margin: 14px 0; }
        .stat-box {
            text-align: center;
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(40,100,150,0.04);
        }
        .notif-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            align-items: center;
            box-shadow: 0 2px 8px rgba(40,100,150,0.04);
        }
        .notif-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--purple); flex-shrink: 0; }
        #toast {
            position: fixed;
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 30px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #fff;
            color: var(--text);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(40,100,150,0.12);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--max-width);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 10px var(--safe-bottom);
            z-index: 100;
            height: var(--nav-height);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            font-size: 0.6rem;
            font-weight: 500;
            position: relative;
            padding: 4px 8px;
            border-radius: 10px;
        }
        .nav-item.active { color: var(--purple-light); }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; transition: var(--transition); }
        .nav-orbita {
            position: relative;
            top: -18px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 3px solid #fff;
            box-shadow: 0 4px 12px rgba(77,163,245,0.3);
        }
        .nav-orbita:hover, .nav-orbita:active { background: var(--purple-light); transform: scale(1.04); }
        .nav-orbita svg { width: 28px; height: 28px; color: #fff; stroke: #fff; fill: none; stroke-width: 2; }

        @media (min-width: 768px) {
            .big-cats { grid-template-columns: repeat(4, 1fr); }
            .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .item-card { width: 190px; }
            .page { padding: 16px 24px 0; }
            .header { padding: calc(14px + var(--safe-top)) 24px 14px; }
        }
        @media (min-width: 1024px) {
            #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-scene" id="splashScene"></div>
            <div class="splash-title">ORBITA</div>
            <div class="splash-sub" id="splashStatus">
                <span id="splashText">Инициализация системы</span>
                <span class="splash-dot"></span><span class="splash-dot"></span><span class="splash-dot"></span>
            </div>
        </div>
    </div>

    <!-- ФОН -->
    <div class="bg-layer"></div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div id="app"></div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->

            function parseUsers(value) {
                const normalized = String(value).replace(',', '.').trim().toUpperCase();
                if (normalized.endsWith('K')) {
                    return parseFloat(normalized) * 1000;
                }
                if (normalized.endsWith('M')) {
                    return parseFloat(normalized) * 1000000;
                }
                return parseFloat(normalized) || 0;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

                try {
                    const stored = localStorage.getItem(key);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) return parsed;
                    }
                } catch (e) {
                    console.warn(`Error parsing ${key}`, e);
                }
                return fallback;
            }

                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {
                    console.warn('Storage save error', e);
                }
            }

                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
            }

            function navigate(page, data = null) {
                if (page === 'home') {
                    state.currentCategory = 'all';
                    state.searchQuery = '';
                }
                state.currentPage = page;
                if (data !== null && page === 'detail') {
                    state.selectedItem = data;
                    markViewed(data.id);
                } else if (page !== 'detail') {
                    state.selectedItem = null;
                }
                updateNavActive();
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function updateNavActive() {
                const navItems = bottomNav.querySelectorAll('.nav-item');
                navItems.forEach(n => n.classList.remove('active'));
                const activeNav = bottomNav.querySelector(`.nav-item[data-page="${state.currentPage}"]`);
                if (activeNav) activeNav.classList.add('active');
                if (state.currentPage === 'detail') {
                    const catNav = bottomNav.querySelector('.nav-item[data-page="catalog"]');
                    if (catNav) catNav.classList.add('active');
                }
            }

            function markViewed(id) {
                if (!state.viewed.includes(id)) {
                    state.viewed.push(id);
                    saveViewed();
                }
            }

            function getItems() {
                return [...items];
            }

            function getItemById(id) {
                return items.find(i => i.id === id);
            }

            function getFilteredItems() {
                let filtered = [...items];
                if (state.currentCategory !== 'all') {
                    const typeMap = { 'channels': 'channel', 'groups': 'group', 'bots': 'bot', 'miniapps': 'miniapp' };
                    const targetType = typeMap[state.currentCategory] || state.currentCategory;
                    filtered = filtered.filter(i => i.type === targetType);
                }
                if (state.searchQuery.trim()) {
                    const q = state.searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(i =>
                        i.name.toLowerCase().includes(q) ||
                        i.description.toLowerCase().includes(q) ||
                        i.category.toLowerCase().includes(q) ||
                        i.tags.some(t => t.toLowerCase().includes(q))
                    );
                }
                if (state.sort === 'popular') {
                    filtered.sort((a, b) => parseUsers(b.users) - parseUsers(a.users));
                } else if (state.sort === 'new') {
                    filtered.sort((a, b) => b.id - a.id);
                } else if (state.sort === 'alpha') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
                }
                return filtered;
            }

            function getPopularItems() {
                return [...items].sort((a, b) => parseUsers(b.users) - parseUsers(a.users)).slice(0, 8);
            }

                const map = { channel: icons.channel, group: icons.group, bot: icons.bot, miniapp: icons.apps };

                const map = { channel: 'Канал', group: 'Группа', bot: 'Бот', miniapp: 'Мини-апп' };

                if (item) navigate('detail', item);

                if (btn) {
                    btn.classList.add('heart-pop');
                    setTimeout(() => btn.classList.remove('heart-pop'), 300);

                const idx = state.favorites.indexOf(id);
                if (idx > -1) {
                    state.favorites.splice(idx, 1);

                    state.favorites.push(id);
                    showToast('Добавлено в избранное');

                state.searchQuery = val;

                    if (state.currentPage === 'home') updateHomeContent();
                    else if (state.currentPage === 'catalog') updateCatalogContent();
                }, 200);

                state.searchQuery = '';
                const input = document.querySelector('.search-input');
                if (input) {

                    input.focus();

                if (state.currentPage === 'home') updateHomeContent();
                else if (state.currentPage === 'catalog') updateCatalogContent();

                state.currentCategory = cat;
                if (state.currentPage === 'detail') navigate('catalog');

                    state.currentCategory = typeMap[itemType] || 'all';

            window._orbita_openExternal = function(id) {

                    showToast('Объект не найден');
                    return;

                if (!item.url) {
                    showToast('Ссылка пока недоступна');
                    return;

                openExternal(item.url);

            // ============ ВНЕШНИЕ ССЫЛКИ (MAX Bridge) ============
            function openExternal(url) {
                try {
                    if (typeof window.MAX !== 'undefined' && window.MAX.openExternal) {
                        // TODO: MAX Bridge
                        window.MAX.openExternal(url);
                    } else if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                        window.Telegram.WebApp.openLink(url);
                    } else {
                        window.open(url, '_blank');

                    handleError(e);
                }

                switch (state.currentPage) {
                    case 'home': html = renderHome(); break;
                    case 'catalog': html = renderCatalog(); break;

                    case 'favorites': html = renderFavorites(); break;
                    case 'profile': html = renderProfile(); break;

                    default: html = renderHome();

                app.innerHTML = html;

            // ============ SPLASH SCREEN АНИМАЦИЯ (исправленная) ============
            function initSplashAnimation() {
                const splash = document.getElementById('splash-screen');
                const scene = document.getElementById('splashScene');
                const statusText = document.getElementById('splashText');

                const svgns = "http://www.w3.org/2000/svg";
                const svg = document.createElementNS(svgns, "svg");
                svg.setAttribute("viewBox", "0 0 280 280");
                svg.style.overflow = "visible";

                // Орбиты
                const orbitGroup = document.createElementNS(svgns, "g");
                const orbit1 = document.createElementNS(svgns, "circle");
                orbit1.setAttribute("cx", "140");
                orbit1.setAttribute("cy", "140");
                orbit1.setAttribute("r", "90");
                orbit1.setAttribute("fill", "none");
                orbit1.setAttribute("stroke", "rgba(77,163,245,0.25)");
                orbit1.setAttribute("stroke-width", "1.5");
                orbit1.setAttribute("stroke-dasharray", "4 4");
                orbitGroup.appendChild(orbit1);

                const orbit2 = document.createElementNS(svgns, "circle");
                orbit2.setAttribute("cx", "140");
                orbit2.setAttribute("cy", "140");
                orbit2.setAttribute("r", "75");
                orbit2.setAttribute("fill", "none");
                orbit2.setAttribute("stroke", "rgba(77,163,245,0.12)");
                orbit2.setAttribute("stroke-width", "1");
                orbitGroup.appendChild(orbit2);
                svg.appendChild(orbitGroup);

                // Tether
                const tetherGroup = document.createElementNS(svgns, "g");
                const centerCircle = document.createElementNS(svgns, "circle");
                centerCircle.setAttribute("cx", "140");
                centerCircle.setAttribute("cy", "140");
                centerCircle.setAttribute("r", "22");
                centerCircle.setAttribute("fill", "#FFFFFF");
                centerCircle.setAttribute("stroke", "#E5F3FF");
                centerCircle.setAttribute("stroke-width", "1.5");
                tetherGroup.appendChild(centerCircle);

                const tetherLetter = document.createElementNS(svgns, "text");
                tetherLetter.setAttribute("x", "140");
                tetherLetter.setAttribute("y", "149");
                tetherLetter.setAttribute("text-anchor", "middle");
                tetherLetter.setAttribute("font-size", "20");
                tetherLetter.setAttribute("font-weight", "700");
                tetherLetter.setAttribute("fill", "#26A17B");
                tetherLetter.setAttribute("font-family", "Inter, sans-serif");
                tetherLetter.textContent = "T";
                tetherGroup.appendChild(tetherLetter);
                svg.appendChild(tetherGroup);

                // Путь запуска: исправлен, конечная точка на окружности (203.6, 76.4)
                const launchPath = document.createElementNS(svgns, "path");
                launchPath.setAttribute("d", "M 140 240 C 140 160, 224.81 97.61, 203.6 76.4");
                launchPath.setAttribute("fill", "none");
                launchPath.setAttribute("stroke", "none");
                launchPath.setAttribute("id", "launchPath");
                svg.appendChild(launchPath);

                // Ракета
                const rocketGroup = document.createElementNS(svgns, "g");
                rocketGroup.setAttribute("id", "rocketGroup");
                rocketGroup.innerHTML = `
                    <g transform="scale(0.7)">
                        <path d="M 12 2 C 10 4, 8 6, 8 9 L 8 12 L 16 12 L 16 9 C 16 6, 14 4, 12 2 Z" fill="#4DA3F5" stroke="#318BEA" stroke-width="0.8"/>
                        <rect x="8" y="12" width="8" height="3" fill="#318BEA" stroke="#318BEA" stroke-width="0.5"/>
                        <circle cx="12" cy="9" r="2" fill="#FFFFFF" stroke="#A0B8CC" stroke-width="0.6"/>
                        <path d="M 9 10 L 6 13 L 9 13 Z" fill="#4DA3F5" stroke="#318BEA" stroke-width="0.5"/>
                        <path d="M 15 10 L 18 13 L 15 13 Z" fill="#4DA3F5" stroke="#318BEA" stroke-width="0.5"/>
                        <rect x="7" y="15" width="2" height="2" fill="#318BEA"/>
                        <rect x="15" y="15" width="2" height="2" fill="#318BEA"/>
                        <path d="M 9 15 L 7 20 L 9 20 Z" fill="#DCEAF6" stroke="#318BEA" stroke-width="0.4"/>
                        <path d="M 15 15 L 17 20 L 15 20 Z" fill="#DCEAF6" stroke="#318BEA" stroke-width="0.4"/>
                        <ellipse cx="12" cy="21" rx="3" ry="5" fill="rgba(77,163,245,0.5)" class="flame"/>
                        <ellipse cx="12" cy="22" rx="2" ry="3" fill="rgba(255,255,255,0.8)" class="flame-core"/>
                    </g>
                `;
                svg.appendChild(rocketGroup);
                scene.appendChild(svg);

                const pathElem = document.getElementById('launchPath');
                const pathLength = pathElem.getTotalLength();
                const flightDuration = 1800;
                const centerX = 140, centerY = 140;
                const orbitRadius = 90;
                const angularSpeed = 0.0025; // рад/мс
                let startTime = null;
                let lastTimestamp = null;
                let orbitAngle = 0;
                let animationFrameId = null;

                function getPointOnPath(progress) {
                    const point = pathElem.getPointAtLength(progress * pathLength);
                    return { x: point.x, y: point.y };
                }

                function getAngleOnPath(progress) {
                    const eps = 0.001;
                    const p1 = getPointOnPath(Math.min(progress + eps, 1));
                    const p2 = getPointOnPath(progress);
                    return Math.atan2(p1.y - p2.y, p1.x - p2.x) * 180 / Math.PI;
                }

                function setRocketPosition(x, y, angleDeg) {
                    rocketGroup.setAttribute('transform', `translate(${x}, ${y}) rotate(${angleDeg})`);
                }

                function updateFlame(scale) {
                    const flames = rocketGroup.querySelectorAll('.flame');
                    const cores = rocketGroup.querySelectorAll('.flame-core');
                    flames.forEach(f => f.setAttribute('ry', (5 * scale).toString()));
                    cores.forEach(c => c.setAttribute('ry', (3 * scale).toString()));
                }

                function animate(timestamp) {
                    if (!startTime) startTime = timestamp;
                    if (!lastTimestamp) lastTimestamp = timestamp;
                    const deltaTime = Math.min(timestamp - lastTimestamp, 32);
                    lastTimestamp = timestamp;

                    const elapsed = timestamp - startTime;

                    if (elapsed < flightDuration) {
                        const progress = Math.min(elapsed / flightDuration, 1);
                        const pos = getPointOnPath(progress);
                        const angle = getAngleOnPath(progress);
                        setRocketPosition(pos.x, pos.y, angle + 90);
                        updateFlame(1.2 + Math.sin(elapsed * 0.01) * 0.3);
                        if (elapsed < 400) statusText.textContent = 'Инициализация системы';
                        else if (elapsed < 1400) statusText.textContent = 'Запуск двигателя...';
                        else statusText.textContent = 'Выход на орбиту...';
                    } else {
                        // Фаза орбиты
                        if (!orbitAngle) {
                            const lastPoint = getPointOnPath(1);
                            const dx = lastPoint.x - centerX;
                            const dy = lastPoint.y - centerY;
                            orbitAngle = Math.atan2(-dy, dx); // так как y_svg = centerY - R*sin(theta), то theta = atan2(-dy, dx)
                        }
                        orbitAngle += angularSpeed * deltaTime;
                        const x = centerX + orbitRadius * Math.cos(orbitAngle);
                        const y = centerY - orbitRadius * Math.sin(orbitAngle);
                        const vx = -Math.sin(orbitAngle);
                        const vy = -Math.cos(orbitAngle);
                        const angleDeg = Math.atan2(vy, vx) * 180 / Math.PI;
                        setRocketPosition(x, y, angleDeg + 90);
                        updateFlame(0.8 + Math.sin(timestamp * 0.005) * 0.2);
                        statusText.textContent = 'ORBITA готова';
                    }

                    animationFrameId = requestAnimationFrame(animate);
                }

                animationFrameId = requestAnimationFrame(animate);

                // Скрытие splash
                const splashStart = performance.now();
                function hideSplash() {
                    const elapsed = performance.now() - splashStart;
                    const minShow = 2000;
                    const delay = Math.max(0, minShow - elapsed);
                    setTimeout(() => {
                        splash.classList.add('splash-hidden');
                        cancelAnimationFrame(animationFrameId);
                        setTimeout(() => {
                            splash.style.display = 'none';
                        }, 500);
                    }, delay);
                }
                setTimeout(hideSplash, 2200);
            }

            // Инициализация
            navigate('home');
            initSplashAnimation();

            // Обработка ошибок глобально
            window.addEventListener('error', function(event) {
                handleError(event.error);
            });

        })();
    </script>
</body>
</html>
